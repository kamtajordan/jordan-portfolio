{% extends "base.html" %}
{% block title %}{{ content.publications.title }} — Kamta Jordan EarthLab{% endblock %}
{% block content %}
<section class="page-header">
    <div class="container">
        <h1>{{ content.publications.title }}</h1>
    </div>
</section>
<section class="section">
    <div class="container">
        <div class="pub-list">
            {% for p in content.publications.list %}
            <div class="pub-item">
                <div class="pub-year">{{ p.year }}</div>
                <div class="pub-content">
                    <h3>{{ p.title }}</h3>
                    <p class="muted">{{ p.venue }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
